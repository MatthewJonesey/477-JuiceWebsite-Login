<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - OWASP Juice Shop (clone)</title>
  <style>
    :root {
      --bg: #303030;
      --toolbar: #212121;
      --card: #424242;
      --text: #ffffff;
      --muted: #b0b0b0;
      --accent: #8bc34a;
      --error: #ff5252;
      --line: #757575;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    header {
      background: var(--toolbar);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 20px;
      font-weight: 500;
      box-shadow: 0 2px 4px rgba(0,0,0,.4);
    }
    main { display: flex; justify-content: center; padding: 48px 16px; }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border-radius: 4px;
      padding: 32px;
      box-shadow: 0 3px 5px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 24px; font-size: 28px; font-weight: 400; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      background: transparent;
      color: var(--text);
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-bottom: 2px solid var(--accent); padding-bottom: 7px; }
    .field.invalid input { border-bottom: 2px solid var(--error); }
    .field.invalid label { color: var(--error); }
    .error { color: var(--error); font-size: 12px; min-height: 16px; margin-top: 4px; }
    .password-wrap { position: relative; }
    .toggle {
      position: absolute; right: 0; top: 4px;
      background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px;
    }
    .toggle:focus-visible, button.login:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .forgot { display: inline-block; margin-bottom: 20px; font-size: 14px; }
    button.login {
      width: 100%;
      background: var(--accent);
      color: #1b1b1b;
      border: 0;
      border-radius: 4px;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    button.login:disabled { opacity: .5; cursor: not-allowed; }
    .remember { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; color: var(--muted); }
    .divider { text-align: center; color: var(--muted); margin: 20px 0 12px; font-size: 13px; }
    .banner { margin-bottom: 16px; padding: 10px 12px; border-radius: 4px; font-size: 14px; display: none; }
    .banner.show { display: block; }
    .banner.fail { background: rgba(255,82,82,.15); color: var(--error); }
    .banner.ok { background: rgba(139,195,74,.15); color: var(--accent); }
    .foot { margin-top: 20px; font-size: 14px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>OWASP Juice Shop (clone)</header>

  <main>
    <form class="card" id="loginForm" novalidate>
      <h1>Login</h1>
      <div id="banner" class="banner" role="alert"></div>

      <div class="field" id="emailField">
        <label for="email">Email *</label>
        <input id="email" name="email" type="email" autocomplete="username" />
        <div class="error" id="emailError"></div>
      </div>

      <div class="field" id="passwordField">
        <label for="password">Password *</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" />
          <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
        </div>
        <div class="error" id="passwordError"></div>
      </div>

      <a href="#" class="forgot">Forgot your password?</a>
      <button type="submit" class="login" id="submit">Log in</button>

      <label class="remember"><input type="checkbox" id="remember" /> Remember me</label>

      <div class="foot">Not yet a customer? <a href="#">Register</a></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const submitBtn = document.getElementById('submit');
    const banner = document.getElementById('banner');

    // Client-side validation: returns an object of field -> error message
    function validate(email, password) {
      const errors = {};
      if (email.trim() === '') errors.email = 'Please provide an email address.';
      else if (!email.includes('@')) errors.email = 'Email must contain "@".';

      if (password === '') errors.password = 'Please provide a password.';
      else if (password.length < 8) errors.password = 'Password must be at least 8 characters.';
      return errors;
    }

    function showFieldErrors(errors) {
      for (const field of ['email', 'password']) {
        document.getElementById(field + 'Field').classList.toggle('invalid', !!errors[field]);
        document.getElementById(field + 'Error').textContent = errors[field] || '';
      }
    }

    function showBanner(message, ok) {
      banner.textContent = message;
      banner.className = 'banner show ' + (ok ? 'ok' : 'fail');
    }

    document.getElementById('toggle').addEventListener('click', (e) => {
      const hidden = passwordEl.type === 'password';
      passwordEl.type = hidden ? 'text' : 'password';
      e.target.textContent = hidden ? 'Hide' : 'Show';
      e.target.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      banner.className = 'banner';

      const errors = validate(emailEl.value, passwordEl.value);
      showFieldErrors(errors);
      if (Object.keys(errors).length > 0) return; // stop: nothing is sent to the server

      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailEl.value.trim(), password: passwordEl.value })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showBanner(data.message, true);
        } else if (data.errors) {
          showFieldErrors(data.errors); // server-side validation errors
        } else {
          showBanner(data.message || 'Login failed.', false);
        }
      } catch (err) {
        showBanner('Could not reach the server.', false);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
